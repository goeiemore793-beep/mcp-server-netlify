version: '3.8'

services:
  mcp-server:
    build: .
    ports:
      - '8080:8080'
    environment:
      - PADDLE_VENDOR_ID=${PADDLE_VENDOR_ID}
      - PADDLE_VENDOR_AUTH_CODE=${PADDLE_VENDOR_AUTH_CODE}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
    restart: always
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: mcp-network