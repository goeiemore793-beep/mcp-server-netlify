[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "PORT,LOG_LEVEL,NODE_ENV,SOLANA_RPC_URL,ETH_RPC_URL,MERCHANT_WALLET_ADDRESS_SOL,MERCHANT_WALLET_ADDRESS_ETH"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/.well-known/*"
  to = "/.netlify/functions/api/.well-known/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/sse"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
