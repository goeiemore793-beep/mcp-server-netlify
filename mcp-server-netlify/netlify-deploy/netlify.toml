[build]
  command = "npm run build"
  functions = "functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"

# Environment variables (set these in Netlify dashboard)
[env.production]
  [env.production.context.production.environment]
    PADDLE_VENDOR_ID = "your_value"
    PADDLE_VENDOR_AUTH_CODE = "your_value"
    JWT_SECRET = "your_value"
    BASE_URL = "https://your-site.netlify.app"
    SERVER_NAME = "My MCP Server"
    SERVER_TAGS = "paid,mcp,tools,productivity"
    SERVER_CATEGORIES = "utilities,data,productivity"

[env.development]
  [env.development.context.development.environment]
    PADDLE_VENDOR_ID = "test_value"
    PADDLE_VENDOR_AUTH_CODE = "test_value"
    JWT_SECRET = "test_secret_at_least_32_characters_long"
    BASE_URL = "http://localhost:8888"

# Redirects for API endpoints
[[redirects]]
  from = "/api/mcp"
  to = "/.netlify/functions/handler"
  status = 200
  force = true

[[redirects]]
  from = "/api/mcp/*"
  to = "/.netlify/functions/handler"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/create"
  to = "/.netlify/functions/create-account"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/refresh"
  to = "/.netlify/functions/refresh-token"
  status = 200
  force = true

[[redirects]]
  from = "/api/discovery"
  to = "/.netlify/functions/discovery"
  status = 200
  force = true

[[redirects]]
  from = "/discovery"
  to = "/.netlify/functions/discovery"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/health/*"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# CORS headers
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

# API endpoint headers
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/json"

# Function settings
[functions]
  node_bundler = "esbuild"
  timeout = 30

# Form handler for Paddle webhooks
[[redirects]]
  from = "/webhooks/paddle"
  to = "/.netlify/functions/paddle-webhook"
  status = 200
  force = true